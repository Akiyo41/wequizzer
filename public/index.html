<!doctype html>
<html lang="fr" data-theme="wequizzer">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081246">
  <!-- Appli installable (manifest + icône iPhone + service worker sans cache, voir sw.js) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
  <title>WeQuizzer</title>
  <link rel="stylesheet" href="/icons/tabler-icons.min.css">
  <link rel="stylesheet" href="/icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="center">
  <!-- Page d'entrée « Tu es ? » : l'animateur d'abord, puis le joueur (qui tape son code PIN) -->
  <main class="narrow">
    <div class="logo big"><span data-logo></span></div>
    <p class="tag">Le quiz en direct avec tes potes</p>
    <div id="hello"></div>
    <div class="create-grid who-grid">
      <a class="card create-card" id="whoHost" href="host.html"><i class="ti ti-player-play"></i><b>J'anime</b><small>Je choisis un quiz et je le lance sur mon écran.</small></a>
      <form class="card create-card who-play" id="f"><i class="ti ti-door-enter"></i><b>Je joue</b>
        <input id="pin" inputmode="numeric" maxlength="12" placeholder="Code PIN" autocomplete="off" aria-label="Code PIN">
        <button class="btn block" type="submit">Rejoindre</button>
        <small>Pas de code ? Demande-le à l'animateur, ou scanne son QR code.</small>
      </form>
    </div>
  </main>
  <script src="brand.js"></script>
  <script>
    Brand.intro();
    Brand.say(document.getElementById('hello'), 'Salut ! Tu es plutôt… ?', 'accueil');
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var pin = document.getElementById('pin').value.replace(/\D/g, '');
      location.href = 'play.html' + (pin ? '?pin=' + pin : '');
    });
  </script>
</body>
</html>
